<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bodyweight Mastery</title>
<meta name="description" content="Pick today's calisthenics skills, get a workout built from your level in each one.">
<meta name="theme-color" content="#14171c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column, bottom tab bar; chalk-on-graphite gym board, cobalt accent.
   Sibling of Project Mastery: same type and surfaces, different accent and a pick-and-build flow. */
:root{
  --bg:#f1f0ec; --surface:#ffffff; --surface2:#e8e6e0; --line:#d6d2c8; --fg:#191c22; --mut:#666a70;
  --accent:#1d4fc4; --accent-ink:#ffffff; --accentSoft:#dfe7fb;
  --good:#2f7d4f; --warn:#a8650f; --bad:#b23a32;
  --c-bal:#1f6f6a; --c-prs:#6a4c93; --c-psh:#c2501c; --c-pll:#2c63a8; --c-cor:#7a6a12; --c-leg:#4d6470;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171c; --surface:#1c2027; --surface2:#262b34; --line:#333a45; --fg:#ebe9e4; --mut:#9a9da3;
  --accent:#8fb4ff; --accent-ink:#10131a; --accentSoft:#22304f;
  --good:#5fbf86; --warn:#e6a04a; --bad:#ef7d72;
  --c-bal:#4fb3aa; --c-prs:#a98fd6; --c-psh:#ea8450; --c-pll:#78a8e6; --c-cor:#cdb84f; --c-leg:#8fa9b6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --surface:#1c2027; --surface2:#262b34; --line:#333a45; --fg:#ebe9e4; --mut:#9a9da3;
  --accent:#8fb4ff; --accent-ink:#10131a; --accentSoft:#22304f;
  --good:#5fbf86; --warn:#e6a04a; --bad:#ef7d72;
  --c-bal:#4fb3aa; --c-prs:#a98fd6; --c-psh:#ea8450; --c-pll:#78a8e6; --c-cor:#cdb84f; --c-leg:#8fa9b6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.9;text-transform:uppercase;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);margin-bottom:5px}
.top .date{font-size:12.5px;color:var(--mut);text-align:right;white-space:nowrap}

.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.sec-h .sub{font-size:12.5px;color:var(--mut)}
.lede{font-size:14px;color:var(--mut);max-width:60ch}

/* skill picker */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk{position:relative;display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 11px 10px;min-height:68px}
.sk::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--cc)}
.sk .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;color:transparent;margin-top:1px}
.sk.on{border-color:var(--accent);background:var(--accentSoft)}
.sk.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sk b{display:block;font-size:14.5px;line-height:1.2}
.sk .meta{display:block;font-size:11.5px;color:var(--mut);margin-top:3px}
.sk .meta .warnc{color:var(--warn);font-weight:700}
.sk[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.easy.on{background:var(--good);border-color:var(--good);color:#fff}
.chip.right.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.hard.on{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.sm{padding:5px 10px;font-size:12px}
.lbl{font-size:12.5px;color:var(--mut);margin-right:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:15px 16px;font-family:var(--f-display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}

.banner{margin-top:10px;padding:11px 13px;border-radius:12px;background:var(--surface2);font-size:13.5px}
.banner b{display:block}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.banner.good{background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.banner.acc{background:var(--accentSoft)}

/* workout */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.sum b{display:block;font-family:var(--f-num);font-size:19px;line-height:1.1}
.sum span{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.prog{height:6px;border-radius:3px;background:var(--surface2);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.blk{margin-top:20px}
.blk-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px;padding-left:10px;border-left:3px solid var(--cc,var(--mut))}
.blk-h h3{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;text-transform:uppercase}
.blk-h .sub{font-size:12px;color:var(--mut);margin-top:3px}
.list{display:flex;flex-direction:column;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.done{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.ex-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 12px 11px 10px}
.tick{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-weight:800;color:transparent;font-size:15px;padding:0}
.ex.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.ex-main{background:none;border:0;text-align:left;padding:0;min-width:0}
.ex-main b{display:block;font-size:14.5px;line-height:1.25}
.ex-main .dose{font-family:var(--f-num);font-size:12.5px;color:var(--mut);margin-top:2px;display:block}
.ex-main .dose em{font-style:normal;color:var(--accent);font-weight:700}
.tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
.ex-body{padding:0 12px 12px 50px;font-size:13.5px;display:flex;flex-direction:column;gap:10px}
.ex-body p{max-width:60ch}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font-family:var(--f-num);font-size:11px;display:grid;place-items:center;color:var(--mut)}
.pip.on{background:var(--good);border-color:var(--good);color:#fff}
.swap{font-size:12.5px;color:var(--mut)}
.res{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.res input{width:74px;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-num)}

/* timer dock */
.dock{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:6;display:none}
.dock.on{display:block}
.dock-in{max-width:640px;margin:0 auto;padding:0 12px}
.timer{background:var(--fg);color:var(--bg);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .ph{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.timer .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.timer .clock{font-family:var(--f-num);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.timer .tb{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.timer .tb button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:700}
.timer.work{background:var(--accent);color:var(--accent-ink)}
.timer.work .tb button{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 45%,transparent)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:10px 0 9px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-top:3px solid transparent}
.tab.on{color:var(--fg);border-top-color:var(--accent)}

/* skills tab */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{width:100%;display:grid;grid-template-columns:1fr;gap:7px;justify-items:start;background:none;border:0;text-align:left;padding:13px 14px;border-left:4px solid var(--cc)}
.card-h b{font-size:16px;display:block}
.card-h .sub{font-size:12.5px;color:var(--mut)}
.lv{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--surface2);border-radius:8px;padding:4px 8px;white-space:nowrap}
.card-b{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}
.ladder{display:flex;flex-direction:column;gap:8px}
.rung{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:30px 1fr;gap:10px}
.rung .n{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;color:var(--mut)}
.rung.cur{border-color:var(--accent);background:var(--accentSoft)}
.rung.cur .n{color:var(--accent)}
.rung.past .n{color:var(--good)}
.rung h4{margin:0;font-size:14.5px}
.rung dl{margin:6px 0 0;font-size:12.5px;display:grid;gap:4px}
.rung dt{font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.rung dd{margin:0}
.rung .acts{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drills{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.step{display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
.step button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800}

/* log */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-family:var(--f-num);font-size:24px;line-height:1.1}
.tile span{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.cal i{display:block;aspect-ratio:1;border-radius:6px;background:var(--surface2);font-style:normal;font-size:9.5px;color:var(--mut);display:grid;place-items:center}
.cal i.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal i.today{outline:2px solid var(--fg);outline-offset:1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;padding-right:0}
.hist{display:flex;flex-direction:column;gap:8px}
.h-it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.h-it .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.h-it .sk-l{font-size:13px;margin-top:4px}
.h-it .rs{font-size:12px;color:var(--mut);margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* guide */
.prose{display:flex;flex-direction:column;gap:10px;font-size:14px;max-width:65ch}
.prose ol,.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.fold summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";font-family:var(--f-num);color:var(--mut)}
.fold[open] summary::after{content:"−"}
.fold .in{padding:0 14px 14px}
.src{display:grid;gap:10px;font-size:13.5px}
.src b{display:block}
textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:9px;font-family:var(--f-num);font-size:11.5px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sw:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:380px){.pick{grid-template-columns:1fr}.brand{font-size:34px}.timer .clock{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* skill pills: same control as the session-length picker */
.chip.skc{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;font-size:13.5px}
.chip.skc i{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
.chip.skc .num{font-size:11px;opacity:.7}
.chip.skc[disabled]{opacity:.45;cursor:not-allowed}
.picked{margin-top:12px;display:grid;gap:6px;font-size:13px;border-left:3px solid var(--accent);padding-left:10px}
.picked b{margin-right:8px}
.warnc{color:var(--warn);font-weight:700}

.picked .row{gap:6px}
.picked > div{padding-bottom:4px}
td.num,th.num{padding-left:12px;white-space:nowrap}
</style></head>
<body>
<div class="wrap"><main id="view"></main></div>
<div id="dock" class="dock"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in"><button class="tab" data-tab="today">Today</button><button class="tab" data-tab="skills">Skills</button><button class="tab" data-tab="care">Prehab</button><button class="tab" data-tab="log">Log</button><button class="tab" data-tab="guide">Guide</button></div></nav>
<script>
/* Bodyweight Mastery: skills, levels and exercises.
   Exercise row: [role, day, name, dose, restSec, cue, swap, needs]
   role  P = main skill work (always in the session) · S = strength support · A = accessory / mobility
   day   A / B = alternating session variants · * = both
   dose  h4x30 = 4 holds of 30s · r3x5 = 3 sets of 5 reps · a60 = collect 60s in as few sets as possible
         t10 = 10 quality attempts · m8 = 8-minute practice window · trailing s = each side
   needs bar / band / pb (parallettes or blocks) / wt (weights) / dip / pole  */
const CATS = {
  balance: { n: 'Balance', c: 'var(--c-bal)' },
  press:   { n: 'Press', c: 'var(--c-prs)' },
  push:    { n: 'Push strength', c: 'var(--c-psh)' },
  pull:    { n: 'Pull strength', c: 'var(--c-pll)' },
  core:    { n: 'Core', c: 'var(--c-cor)' },
  legs:    { n: 'Legs', c: 'var(--c-leg)' }
};

const SKILLS = [
/* ───────────────────────── HANDSTAND ───────────────────────── */
{ id: 'hs', name: 'Handstand', short: 'HS', cat: 'balance', order: 1, prep: ['wrist', 'shoulder'], freq: '4–6 × / week, short and fresh',
  blurb: 'A straight, quiet freestanding handstand. Balance is a skill: many short, clean attempts beat a few long, tired ones.',
  levels: [
  { n: 'Wall line', here: 'New to handstands, or a chest-to-wall hold under 45s.', test: 'Chest-to-wall hold 60s with a straight line, plus 5 controlled kick-ups to the wall.', ex: [
    ['P','A','Chest-to-wall handstand hold','h4x30',60,'Walk the feet up, nose and toes near the wall. Push the floor away, ribs in, squeeze the glutes.','Feet-on-box pike hold'],
    ['P','A','Kick-up to the wall (back to wall)','r3x5',45,'Same lead leg each rep. Arrive softly: the heels should kiss the wall, not hit it.','Wall walk, halfway up'],
    ['P','B','Chest-to-wall shoulder shrugs','r3x10',45,'Arms locked. Sink 2cm through the shoulders, then push as tall as you can and pause 1s.','Standing overhead shrugs with a stick'],
    ['P','B','Back-to-wall hold, one foot off the wall','h4x20',60,'Float one heel, then swap. Find the pressure in the fingertips that keeps you there.','Back-to-wall hold'],
    ['S','*','Crow pose hold','h3x20',45,'Knees on the upper arms, lean until the toes float. Teaches you to save balance with the fingers.','Frog stand with toes down'],
    ['S','*','Hollow body hold','h3x30',45,'Lower back glued to the floor, arms by the ears. This is your handstand shape lying down.','Tuck hollow hold'],
    ['A','*','Wall shoulder-opening stretch','h2x45',20,'Hands on the wall at hip height, chest sinks, ribs stay in.','Puppy pose on the floor'] ] },
  { n: 'Leaving the wall', here: 'Wall hold 60s is solid, free balance lasts under 5s.', test: 'Freestanding 10s on 3 of 5 attempts.', ex: [
    ['P','A','Heel pulls (back to wall)','r4x5',45,'Start with heels on the wall. Press the fingertips to pull the heels off, hold 2s, return softly.','Back-to-wall hold with one foot floating'],
    ['P','A','Toe pulls (chest to wall)','r4x5',45,'Shift the weight to the heel of the hand until the toes leave the wall, hold 2s.','Chest-to-wall hold'],
    ['P','B','Back-to-wall tuck balance','h4x15',60,'Hips on the wall, knees tucked. Take the hips off and balance the tuck.','Back-to-wall straddle balance'],
    ['P','B','Chest-to-wall handstand hold','h3x45',60,'Line check before the balance work. Tall shoulders, eyes between the thumbs.','Feet-on-box pike hold'],
    ['P','*','Freestanding kick-up attempts','t10',40,'Kick to balance, not past it. Count only the attempts where you arrive stacked.','Kick-ups a hand-length from the wall'],
    ['S','*','Feet-elevated pike push-up','r3x6',75,'Hips above the shoulders, head travels forward of the hands.','Pike push-up on the floor'],
    ['S','*','Hollow rocks','r3x15',45,'Rock without changing shape. Lower back never lifts.','Hollow body hold 30s'],
    ['A','*','Jefferson curl, bodyweight','r2x8',20,'Roll down one vertebra at a time, legs straight. Slow.','Standing forward fold 45s'] ] },
  { n: 'Free balance', here: 'You hold a freestanding handstand around 10s.', test: 'Freestanding 30s with a straight line, twice in one session.', ex: [
    ['P','*','Freestanding handstand, max holds','t8',60,'No more than 8 attempts. Stop the set when the line breaks, not when you fall.','Heel pull to free hold'],

function paintSync() { const el = $('#sync'); if (el) el.textContent = cloudState === 'cloud' ? 'Your progress is saved to your Claude account and follows you across devices.' : memOnly ? 'This browser is not letting the app save. Copy a backup before you close the page.' : 'Your progress is saved on this device.'; }

/* ───────── actions ───────── */
let toastT = null;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
function suggest() { const max = S.min <= 30 ? 2 : S.min >= 90 ? 4 : 3; const pool = SKILLS.filter(s => !missing(s)).map(s => { const d = lastTrained(s.id); return { s, age: d ? dayDiff(d, today()) : 999 }; }).filter(x => !(x.age <= 1 && ['push', 'pull'].includes(x.s.cat))).sort((a, b) => b.age - a.age || a.s.order - b.s.order);
  const out = [], cats = {}; const take = x => { out.push(x.s.id); cats[x.s.cat] = (cats[x.s.cat] || 0) + 1; };
  ['balance', 'push', 'pull'].forEach(c => { const x = pool.find(p => p.s.cat === c && !out.includes(p.s.id)); if (x && out.length < max) take(x); });
  pool.forEach(x => { if (out.length < max && !out.includes(x.s.id) && !(cats[x.s.cat] >= 1 && ['push', 'pull', 'balance'].includes(x.s.cat))) take(x); });
  S.sel = out; }
function finish() { const W = S.cur; let tot = 0, dn = 0; const res = {};
  W.blocks.forEach(b => b.items.forEach(it => { tot++; if (it.done) dn++; const v = parseFloat(String(it.res).replace(',', '.')); if (!isNaN(v) && v > 0) { const nm = it.sw ? it.swap : it.n; res[nm] = v; if (!S.best[nm] || v > S.best[nm]) S.best[nm] = v; } }));
  const sk = [], hints = [];
  W.blocks.filter(b => byId[b.key]).forEach(b => { sk.push({ id: b.key, l: b.L, v: b.v, f: b.feel || '' }); const t = tun(b.key);
    if (b.feel === 'easy') S.tune[b.key] = Math.min(3, t + 1); else if (b.feel === 'hard') S.tune[b.key] = Math.max(-2, t - 1);
    if (tun(b.key) >= 2 && b.L < 5) hints.push(byId[b.key].name); });
  const care = W.blocks.filter(b => b.care).map(b => ({ a: b.area, m: b.rehab ? (b.stage || 'calm') : 'pre', p: b.pain || '' }));
  S.log.push({ d: W.d, min: W.min, act: Math.max(1, Math.round((Date.now() - W.start) / 60000)), sk, care, dn, tot, res });
  S.cur = null; S.open = {}; S.varOv = {}; if (T) { clearInterval(tick); T = null; paintTimer(); }
  S.flash = ['Session saved: ' + dn + ' of ' + tot + ' exercises.', hints.length ? ' ' + hints.join(', ') + ' is feeling easy. Open Skills and try the level test.' : sk.length ? ' Ratings are in: the next session is adjusted for you.' : ' Logged under Prehab.'];
  save(); render(); window.scrollTo(0, 0); }
let armed = null;
function confirmTap(key, msg) { if (armed === key) { armed = null; return true; } armed = key; toast(msg); setTimeout(() => { if (armed === key) armed = null; }, 3000); return false; }

document.addEventListener('click', e => { const b = e.target.closest('[data-act],[data-tab].tab'); if (!b) return; const a = b.dataset.act, d = b.dataset;
  if (b.classList.contains('tab') || a === 'go') { S.tab = d.tab; if (S.flash && d.tab !== 'today') S.flash = null; save(); render(); window.scrollTo(0, 0); return; }
  const kk = d.k && d.k.includes('-') ? d.k.split('-').map(Number) : null;
  switch (a) {
    case 'pick': { const i = S.sel.indexOf(d.id); if (i >= 0) S.sel.splice(i, 1); else S.sel.push(d.id); S.flash = null; break; }
    case 'clear': S.sel = []; break;
    case 'suggest': suggest(); toast(S.sel.length ? 'Picked the skills you have left longest' : 'Nothing to suggest yet'); break;
    case 'min': S.min = +d.m; break;
    case 'build': { const w = buildWorkout(); if (!w) return; S.cur = w; S.open = {}; S.flash = null; const f = w.blocks.findIndex(x => x.items.length); if (f >= 0) S.open[f + '-0'] = true; save(); render(); window.scrollTo(0, 0); return; }
    case 'flip': { S.varOv = S.varOv || {}; const cur = S.cur.blocks.find(x => x.key === d.id); S.varOv[d.id] = cur.v === 'A' ? 'B' : 'A'; const old = {}; S.cur.blocks.forEach(x => x.items.forEach(it => old[it.n] = it)); const w = buildWorkout(); w.start = S.cur.start; w.blocks.forEach(x => { const ob = S.cur.blocks.find(y => y.key === x.key); if (ob) x.feel = ob.feel || ''; x.items.forEach(it => { const o = old[it.n]; if (o) { it.done = o.done; it.u = Math.min(o.u, unitsOf(it.d)); it.got = o.got; it.res = o.res; } }); }); S.cur = w; S.open = {}; toast('Switched to session ' + S.varOv[d.id]); break; }
    case 'open': S.open[d.k] = !S.open[d.k]; break;
    case 'tick': { const it = itemAt(kk[0], kk[1]); it.done = !it.done; if (!it.done) { it.u = 0; it.got = 0; } else it.u = unitsOf(it.d); break; }
    case 'hold': startHold(kk[0], kk[1]); return;
    case 'rest': startRest(kk[0], kk[1]); return;
    case 'swap': { const it = itemAt(kk[0], kk[1]); it.sw = !it.sw; break; }
    case 'feel': { const bl = S.cur.blocks[+d.b]; bl.feel = bl.feel === d.f ? '' : d.f; break; }
    case 'finish': finish(); return;
    case 'pain': { const bl = S.cur.blocks[+d.b]; bl.pain = bl.pain === d.p ? '' : d.p; break; }
    case 'c-mode': S.care.mode = d.m; break;
    case 'c-area': { const i = S.care.areas.indexOf(d.id); if (i >= 0) S.care.areas.splice(i, 1); else S.care.areas.push(d.id); break; }
    case 'c-sugg': S.care.areas = careSuggest().slice(0, 3); break;
    case 'c-stage': S.care.st[d.id] = d.s; break;
    case 'c-min': S.care.min = +d.m; break;
    case 'c-start': { const bl = buildCare(); if (!bl.length) return; const rehab = S.care.mode === 'rehab'; S.cur = { d: today(), min: S.care.min, est: Math.max(1, Math.round(bl.reduce((x, b) => x + b.items.reduce((y, it) => y + estSec(it.d, it.rest), 0), 0) / 60)), blocks: bl, warn: [], start: Date.now(), rehab }; S.open = { '0-0': true }; S.tab = 'today'; save(); render(); window.scrollTo(0, 0); return; }
    case 'c-add': { const bl = buildCare(); if (!bl.length || !S.cur) return; S.cur.blocks = S.cur.blocks.filter(b => !(b.care && S.care.areas.includes(b.area))); const ci = S.cur.blocks.findIndex(b => b.key === 'cool'); const at = ci >= 0 ? ci : S.cur.blocks.length; S.cur.blocks.splice(at, 0, ...bl); S.cur.est += Math.round(bl.reduce((x, b) => x + b.items.reduce((y, it) => y + estSec(it.d, it.rest), 0), 0) / 60); S.open = {}; S.tab = 'today'; save(); render(); toast('Added before the cool-down'); return; }
    case 'rebuild': if (!confirmTap('rb', 'Tap again to go back and rebuild')) return; S.cur = null; S.open = {}; break;
    case 'discard': if (!confirmTap('dc', 'Tap again to discard this session')) return; S.cur = null; S.open = {}; S.varOv = {}; if (T) { clearInterval(tick); T = null; paintTimer(); } break;
    case 'sopen': S.open['s-' + d.id] = !S.open['s-' + d.id]; break;
    case 'setlv': S.lv[d.id] = +d.l; S.tune[d.id] = 0; SKILLS.forEach(s => { if (!S.lv[s.id]) S.lv[s.id] = 1; }); toast(byId[d.id].name + ': level ' + d.l); break;
    case 'tune': S.tune[d.id] = Math.min(3, Math.max(-2, tun(d.id) + (+d.d))); break;
    case 'dellog': if (!confirmTap('dl' + d.i, 'Tap again to delete this entry')) return; S.log.splice(+d.i, 1); break;
    case 'deload': S.deload = !S.deload; break;
    case 'sound': S.sound = !S.sound; if (S.sound) beep(880, 120); break;
    case 'theme': S.theme = d.t; applyTheme(); break;
    case 'eq': S.eq[d.k] = !S.eq[d.k]; S.sel = S.sel.filter(id => !missing(byId[id])); break;
    case 'bk-show': $('#bk').value = JSON.stringify(S); return;
    case 'bk-copy': { const t = JSON.stringify(S); $('#bk').value = t; try { navigator.clipboard.writeText(t).then(() => toast('Backup copied'), () => toast('Select the text and copy it')); } catch (x) { toast('Select the text and copy it'); } return; }
    case 'bk-file': { try { const u = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); const l = document.createElement('a'); l.href = u; l.download = 'bodyweight-mastery-backup-' + today() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); } catch (x) { toast('Use Copy backup instead'); } return; }
    case 'bk-restore': { try { const o = JSON.parse($('#bk').value); if (!o || !o.v || !Array.isArray(o.log)) throw 0; if (!confirmTap('rs', 'Tap again to replace your data with this backup')) return; S = merge(o); S.tab = 'guide'; toast('Backup restored'); } catch (x) { toast('That text is not a Bodyweight Mastery backup'); return; } break; }
    case 'reset': if (!confirmTap('rz', 'Tap again to erase all levels and history')) return; S = DEF(); S.tab = 'guide'; break;
    case 't-stop': stopTimer(false); return;
    case 't-bank': stopTimer(true); return;
    case 't-skip': if (T) { T.end = Date.now(); } return;
    case 't-add': if (T) { T.end += 15000; paintTimer(); } return;
    default: return; }
  save(); render(); });
